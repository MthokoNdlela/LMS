name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Optional: set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)
      # to the HTTPS address of the hosted API. Without it the site is built against http://localhost:5279.
      - name: Point the app at the hosted API
        if: ${{ vars.API_URL != '' }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: printf "export const API_URL = '%s';\n" "$API_URL" > src/app/core/config.ts

      - run: npm ci

      - run: npx ng test --watch=false

      - run: npx ng build --configuration production --base-href /${{ github.event.repository.name }}/

      # Pages serves 404.html for unknown paths, which lets deep links and refreshes reach the Angular router.
      - run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
